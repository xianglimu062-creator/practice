<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>会員登録</h1>
        <p>以下の情報を入力し、確認ボタンを押してください。</p>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>お客様情報</legend>
                <div class="form-item">
                    <label for="last-name">
                        <span class="label-text">姓</span>
                        <span class="colon">：</span>
                        <input type="text">
                    </label>
                </div>

                <div class="form-item">
                    <label for="first-name">
                        <span class="label-text">名</span>
                        <span class="colon">：</span>
                        <input type="text">
                    </label>
                </div>

                <div class="form-item">
                    <label for="address">
                        <span class="label-text">住所</span>
                        <span class="colon">：</span>
                        <input type="text">
                    </label>
                </div>

                <div class="form-item">
                    <label for="e-mail">
                        <span class="label-text">メールアドレス</span>
                        <span class="colon">：</span>
                        <input type="email">
                    </label>
                </div>

                <div class="form-item">
                    <label for="tel">
                        <span class="label-text">電話番号</span>
                        <span class="colon">：</span>
                        <input type="tel">
                    </label>
                </div>

                <div class="form-item">
                    <label for="birthday">
                        <span class="label-text">生年月日</span>
                        <span class="colon">：</span>
                        <input type="date">
                    </label>
                </div>

                <div class="form-item">
                    <label for="age">
                        <span class="label-text">年齢</span>
                        <span class="colon">：</span>
                        <input type="text" id="age">
                    </label>
                </div>

                <div class="form-item">
                    <label for="gender">
                        <span class="label-text">性別</span>
                        <span class="colon">：</span>
                        <input type="radio" name="gender">
                        <label for="male">男</label>
                        <input type="radio" name="gender">
                        <label for="female">女</label>
                        <input type="radio" name="gender">
                        <label for="other">その他</label>
                    </label>
                </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>パスワード</legend>
                <div class="password-message">
                    <p>英数字以上で入力してください。</p>
                </div>
                <label for="password">
                    <input type="password" name="password">
                </label>
                <div class="password-message">
                    <p>確認のためもう一度入力してください。</p>
                </div>
                <label for="password">
                    <input type="password" name="password">
                </label>
            </fieldset>
            <fieldset class="magazine">
                <legend>希望メールマガジン</legend>
                /forをつけるならidも必要。小要素のnameは同じ方がいい。nameは同じvalueで分ける
                <label for="it">
                    <input type="checkbox" name="it"> IT
                </label>
                <label for="sales">
                    <input type="checkbox" name="sales">営業
                </label>
                <label for="service">
                    <input type="checkbox" name="service">接客
                </label>
                <label for="medical">
                    <input type="checkbox" name="medical">医療
                </label>
            </fieldset>
            <fieldset class="rule">
                <legend>利用規約</legend>
                <a href="http:url">利用規約を確認する</a>
                <label for="rule">
                    <input type="checkbox" name="rule">規約に同意する
                </label>
            </fieldset>
            <button type="reset">内容をクリアする</button>
            <button type="submit" class="btn-submit">送信する</button>

        </form>
    </main>



</body>

</html>
